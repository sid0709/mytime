name: Release App

# Publishes a GitHub Release for the version in src-tauri/tauri.conf.json.
# Bump that version (and ideally package.json / Cargo.toml) before merging
# to main so existing installs are offered an in-app update.
#
# macOS: ad-hoc signed (no Apple Developer account). Users install with:
#   curl -fsSL https://github.com/sid0709/mytime/releases/latest/download/install-macos.sh | bash
#
# Updater signatures: set TAURI_SIGNING_PRIVATE_KEY (full minisign key file).
# If it is unset, installers still publish; in-app updates will not be signed.
#
# Windows SmartScreen: set repo secrets WINDOWS_CERTIFICATE (base64 PFX) and
# WINDOWS_CERTIFICATE_PASSWORD. An unsigned build still ships if those are empty.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --config src-tauri/tauri.ci.conf.json --target aarch64-apple-darwin
          - platform: macos-latest
            args: --config src-tauri/tauri.ci.conf.json --target x86_64-apple-darwin
          - platform: windows-latest
            args: --config src-tauri/tauri.ci.conf.json

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Enable updater artifacts when signing key is present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.ci.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.bundle = config.bundle || {};
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) {
              config.bundle.createUpdaterArtifacts = true;
              console.log("updater artifacts enabled");
            } else {
              delete config.bundle.createUpdaterArtifacts;
              console.log("updater artifacts skipped (set TAURI_SIGNING_PRIVATE_KEY to enable in-app updates)");
            }
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: MyTime v__VERSION__
          releaseBody: |
            ## macOS
            Install without Gatekeeper "damaged app" errors:

            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-macos.sh | bash
            ```

            Then allow Input Monitoring when MyTime asks.

            ## Windows
            Download the NSIS installer (`.exe`). SmartScreen stays quiet only when the build is Authenticode-signed with `WINDOWS_CERTIFICATE`.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  attach-macos-installer:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload install-macos.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          chmod +x scripts/install-macos.sh
          gh release upload "v${VERSION}" scripts/install-macos.sh --clobber
